<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<img id="my-image" />

<body>

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
            rel="stylesheet">
        <script src="https://unpkg.com/fast-average-color/dist/index.browser.min.js"></script>
        <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
        <style>
            :root {
                --acc: 255, 255, 255;
            }

            .line-wobble,
            .line-wobble::after {
                border-radius: calc(var(--uib-line-weight)/ 2)
            }

            .line-wobble::after,
            .line-wobble::before {
                content: '';
                height: 100%;
                width: 100%;
                background-color: rgba(var(--acc), 1.0);
            }

            .line-wobble {
                --uib-size: 120px;
                --uib-speed: 1.55s;
                --uib-color: rgba(var(--acc), 0.5);
                --uib-line-weight: 6px;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                height: var(--uib-line-weight);
                width: var(--uib-size);
                overflow: hidden;
                transform: translate3d(0, 0, 0)
            }

            .line-wobble::before {
                position: absolute;
                top: 0;
                left: 0;
                opacity: .2
            }

            .line-wobble::after {
                animation: wobble var(--uib-speed) ease-in-out infinite;
                transform: translateX(-90%)
            }

            #webdesk-loading {
                position: fixed;
                left: 0px; right: 0px; top: 0px; bottom: 0px;
                background-color: #000;
                z-index: 9999999999999999999;
            }

            #center {
                position: fixed;
                left: 50%; 
                top: 50%;
                transform: translate(-50%, -50%);
                max-width: 90%;
            }
        </style>
        <script type="module">
            import { animate, scroll } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm"
            window.Animate = animate;
            window.Scroll = scroll;
        </script>
    </head>

    <body>
        <div id="webdesk-loading">
            <div id="center">
                <div class="line-wobble"></div>
            </div>
        </div>
    </body>
    <script>
        // WebDesk File System v?.?
        // dbh_ra9 - Mar 19, 2026
        // Assisted, NOT written with AI
        var version = "0.3.3";
        var WFSVer = "// WFS v67.0";
        var ZIPJSVer = "// 1up"
        var WFS;
        var opID = 0;
        var promises = {}
        var initalr = false;
        var overzip = false;
        (async function () {
            let over = false;
            async function loadwfs(code) {
                const blob = new Blob([code], { type: "application/javascript" });
                const url = URL.createObjectURL(blob);
                WFS = await new Worker(url);
                await FS.init();
            }
            if (navigator.onLine) {
                let code = localStorage.getItem("wfs_worker");

                if (!code || !code.startsWith(WFSVer)) {
                    console.log(`<i> ${WFSVer} installed or updated in localStorage`);
                    const res = await fetch("./wfs.js");
                    code = await res.text();
                    localStorage.setItem("wfs_worker", code);
                    await loadwfs(code);
                } else {
                    await loadwfs(code);
                }
            } else {
                const code = localStorage.getItem("wfs_worker");
                if (!code) {
                    console.log("<!> It's over");
                    over = true;
                } else {
                    await loadwfs(code);
                }
            }

            if (!over) {
                WFS.addEventListener("message", (event) => {
                    const data = event.data;

                    if (data.contents === "initdone") {
                        boot();
                        return;
                    }

                    const promise = promises[data.opID];

                    if (!promise) return;

                    if (data.error) {
                        promise.reject(data.error);
                    } else {
                        // console.log('resolving promise for ' + data.opID);
                        promise.resolve(data.contents);
                    }

                    delete promises[data.opID];
                });
            }
        })();

        const FS = {
            init: function (unsafe) {
                if (initalr === false || unsafe === true) {
                    initalr = true;
                    opID = opID + 1;
                    WFS.postMessage({ opID, op: "init" });
                } else {
                    console.log(`<i> can't start WFS twice!`);
                }
            },
            erase: function (confirmation, uID) {
                return new Promise((resolve, reject) => {
                    console.log(`<i> Fully removing workers...`);
                    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "erase", contents: confirmation });
                });
            },
            read: function (path, uID, returnAllData) {
                return new Promise((resolve, reject) => {
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "read", path, contents: uID, type: returnAllData });
                });
            },
            checkType: function (path) {
                return new Promise((resolve, reject) => {
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "checkType", path });
                });
            },
            write: function (path, contents, type) {
                return new Promise((resolve, reject) => {
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "write", path, contents, type });
                });
            },
            cp: async function (pathToCopy, pathToPlace) {
                const copy = await FS.read(pathToCopy);
                const type = await FS.checkType(pathToCopy);
                await FS.write(pathToPlace, copy, type);
            },
            rm: function (path) {
                return new Promise((resolve, reject) => {
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "rm", path });
                });
            },
            mkdir: function (path) {
                return new Promise((resolve, reject) => {
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "mkdir", path });
                });
            },
            ls: function (path) {
                return new Promise((resolve, reject) => {
                    opID++;
                    promises[opID] = { resolve, reject };
                    WFS.postMessage({ opID, op: "ls", path: path });
                });
            },
            normalizeUserPath: function (path) {
                return sys.userPath + path;
            }
        };

        // LITERALLY COPIED from WebDesk 0.3.3's previous rebuild

        var set = {
            async ensureConfigLoaded() {
                if (!sys.config) {
                    try {
                        const raw = await FS.read(FS.normalizeUserPath('config/config.json'));
                        if (!raw) {
                            sys.config = {};
                            return;
                        }
                        sys.config = JSON.parse(raw);
                        console.log(sys.config);
                    } catch (e) {
                        if (core.debug === true) console.log(e);
                        sys.config = {};
                    }
                }
            },
            async write(key, value) {
                try {
                    await this.ensureConfigLoaded();
                    sys.config[key] = value;
                    await FS.write(FS.normalizeUserPath('config/config.json'), JSON.stringify(sys.config), 'text');
                    return true;
                } catch (error) {
                    console.log(error);
                    return false;
                }
            },
            async del(key) {
                try {
                    await this.ensureConfigLoaded();
                    delete sys.config[key];
                    await FS.write(FS.normalizeUserPath('config/config.json'), JSON.stringify(sys.config), 'text');
                    return true;
                } catch (error) {
                    console.log(error);
                    return false;
                }
            },
            async read(key) {
                await this.ensureConfigLoaded();
                return sys.config[key];
            },
        };
    </script>
    <script>
        var sys = {
            userPath: "/home/user/",
            config: undefined,
        }

        var core = {
            mobile: false,
            debug: true,
            latestVersion: '0.3.3',
            lowgfxMode: false,
            incrementTask: 0,
            tasks: [],
            onTaskStart: [],
            onTaskClosed: [],
            async loadScript(data2, path) {
                console.log('<i> Loading JS: ' + path);
                if (path === true) {
                    const data = await FS.read(data2);
                    if (!data) {
                        console.error(`<!> ${data2} not found or not readable.`);
                        return;
                    }
                    data2 = data;
                }
                var script = document.createElement('script');
                script.textContent = data2;
                document.head.appendChild(script);
            },
            async loadStyle(data2, path) {
                console.log('<i> Loading CSS: ' + path);
                if (path === true) {
                    const data = await FS.read(data2);
                    if (!data) {
                        console.error(`<!> ${data2} not found or not readable.`);
                        return;
                    }
                    data2 = data;
                }
                var script = document.createElement('style');
                script.textContent = data2;
                document.head.appendChild(script);
            },
            async loadModule(code2, path) {
                const id = this.incrementTask++;
                if (path === true) {
                    const read = await FS.read(code2);
                    code2 = read;
                }

                const code = `export var id = ${id};\n` + code2;
                const blob = new Blob([code], { type: "application/javascript" });
                const url = URL.createObjectURL(blob);
                const mod = await import(url);

                core.tasks = core.tasks || {};
                core.tasks[id] = {
                    name: mod.name || 'Unnamed Module',
                    id,
                    task: mod
                };

                console.log(core.tasks[id]);

                const task = { name: mod.name || 'Unnamed Module', id, task: mod };
                this.tasks.push(task);
                this.onTaskStart.forEach(cb => cb.callback(task));
                URL.revokeObjectURL(url);

                return mod;
            },
            async removeModule(id) {
                const index = this.tasks.findIndex(t => t.id === id);
                if (index !== -1) {
                    this.tasks.splice(index, 1);
                    this.onTaskClosed.forEach(cb => cb.callback(id));
                }

                if (core.tasks && core.tasks[id]) {
                    delete core.tasks[id];
                }
            },
            async loadApp(path) {
                const app = await core.loadModule(path, true);
                return app;
            }
        }
        console.log("<i> WebDesk Bootloader (Immutable) initializing filesystem");
        console.log("<i> Conducting image test...");
        async function boot() {
            if (navigator.onLine) {
                let code = localStorage.getItem("zip.min.js");

                if (!code || !code.startsWith(ZIPJSVer)) {
                    console.log(`<i> zip.js ${ZIPJSVer} installed or updated in localStorage`);
                    const res = await fetch("./zip.min.js");
                    code = await res.text();
                    localStorage.setItem("zip.min.js", code);
                    await core.loadScript(code);
                } else {
                    await core.loadScript(code);
                }
            } else {
                const code = localStorage.getItem("zip.min.js");
                if (!code) {
                    console.log("<!> It's over");
                    overzip = true;
                } else {
                    await core.loadScript(code);
                }
            }

            // checkFileTypes rewritten by ChatGPT to be more efficient
            function checkFileTypes(filepath) {
                const blobFiles = [".png", ".jpg", ".jpeg", ".mp4", ".mp3", ".wav"];
                const lower = filepath.toLowerCase();

                return blobFiles.some(ext =>
                    lower.endsWith(ext) || lower.endsWith(ext + "/")
                );
            }

            // BOOTLOADER CODE
            // BOOTLOADER CODE
            // BOOTLOADER CODE

            async function installWebDesk() {
                const res = await fetch("./desk.zip", { cache: "no-cache" });
                blob = await res.blob();
                const reader = new zip.ZipReader(new zip.BlobReader(blob));

                const entries = await reader.getEntries();
                console.log(entries);
                if (entries.length) {
                    let i = 0;
                    async function iterate() {
                        if (i !== entries.length) {
                            if (entries[i].directory === true) {
                                console.log('<i> skipping directory: ' + entries[i]);
                            } else {
                                let contents;
                                const blobit = checkFileTypes(entries[i].filename);
                                if (blobit === true) {
                                    contents = await entries[i].getData(new zip.BlobWriter());
                                    console.log(entries[i].filename, ` is a blob`);
                                } else {
                                    contents = await entries[i].getData(new zip.TextWriter());
                                }
                                let type = "text";
                                if (blobit === true) type = "blob";
                                await FS.write("/" + entries[i].filename, contents, type);
                            }
                            i++
                            await iterate();
                        }
                    }
                    await iterate();
                }

                await reader.close();
                console.log('<i> Starting post-install config');
                await core.loadScript('/system/configure.js', true);
                await regSetup();
                console.log('<i> Install successful');
                await FS.write('/system/version', version);
                await init();
            }

            async function init() {
                console.log('<i> Starting WebDesk...');
                await core.loadScript('/system/ui.js', true);
                await core.loadStyle('/system/styles.css', true);
                console.log(`<i> Initializing Material UI...`);
                await core.loadScript('/system/mui.js', true);

                await UI.initialize();

                // variables
                await set.read('animsSlow').then(speed => {
                    UI.animSpeed.slow = speed;
                    UI.system.changeCSSVar('anim-speed-slow', `${speed}s`);
                });
                await set.read('animsMed').then(speed => {
                    UI.animSpeed.med = speed;
                    UI.system.changeCSSVar('anim-speed-med', `${speed}s`);
                });
                await set.read('animsFast').then(speed => {
                    UI.animSpeed.fast = speed;
                    UI.system.changeCSSVar('anim-speed-fast', `${speed}s`);
                });
                await set.read('font-family').then(font => {
                    UI.system.changeCSSVar('md-ref-typeface-plain', font);
                });
                await set.read('mobile').then(mobile => {
                    if (mobile === "true") core.mobile = true;
                });

                const Launcher = await core.loadModule('/system/apps/Launcher.app/index.js', true);
                const editor = await Launcher.launch(FS, UI, core);
                await core.loadScript('/system/init.js', true);
                UI.anims.fadeOut(document.getElementById('webdesk-loading')).then(() => document.getElementById('webdesk-loading').remove());
            }

            // FORCEUPDATE flag

            const FORCEUPDATE = await set.read('FORCEUPDATE');

            // END OF FORCEUPDATE flag 

            const ver = await FS.read('/system/version');
            if (ver !== version || FORCEUPDATE === "true") {
                console.log('WebDesk is out of date! Updating...');
                installWebDesk();
            } else {
                init();
            }

            // END OF BOOTLOADER CODE
            // END OF BOOTLOADER CODE
            // END OF BOOTLOADER CODE
        }
    </script>
</body>
